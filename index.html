<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Earn It — personal habit tracker and recovery companion. All data stays on your device.">
  <title>Earn It</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Earn It</h1>
    <span id="headerStatus" class="pill"></span>
  </header>

  <main id="main">
    <section id="view-today" class="view active"></section>
    <section id="view-rewards" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="today"><span class="tab-icon">&#10003;</span><span>Today</span></button>
    <button class="tab" data-view="rewards"><span class="tab-icon">&#127873;</span><span>Rewards</span></button>
    <button class="tab" data-view="settings"><span class="tab-icon">&#9881;</span><span>Settings</span></button>
  </nav>

  <div id="modal" class="modal hidden">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script src="logic.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
